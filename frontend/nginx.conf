server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 4m;
  server_tokens off;

  # security headers are included per location (nginx does not inherit add_header into blocks that set their own)
  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /assets/ { include /etc/nginx/snippets/security-headers.conf; expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { include /etc/nginx/snippets/security-headers.conf; try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
